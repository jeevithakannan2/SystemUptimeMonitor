<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — SystemUptimeMonitor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-brand"><span>&#9679;</span> UptimeMonitor</div>
        <div class="nav-links">
            <a href="dashboard.html" class="active">Monitors</a>
            <a href="admin.html" id="nav-admin" style="display: none;">Admin</a>
            <a href="status.html">Status</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="container">
        <!-- Monitors Section -->
        <div class="page-header">
            <h1>Monitors</h1>
            <button class="btn btn-primary" onclick="openModal('createMonitorModal')">+ Add Monitor</button>
        </div>
        <div id="monitorsTable" class="card">
            <div class="empty-state"><p>Loading monitors...</p></div>
        </div>

        <!-- Incidents Section -->
        <div class="page-header mt-16">
            <h1>Incidents</h1>
        </div>
        <div id="incidentsTable" class="card">
            <div class="empty-state"><p>Loading incidents...</p></div>
        </div>
    </div>

    <!-- Create Monitor Modal -->
    <div class="modal-overlay" id="createMonitorModal">
        <div class="modal">
            <h2>Add Monitor</h2>
            <form id="createMonitorForm">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" placeholder="e.g. Production API" required>
                </div>
                <div class="form-group">
                    <label>Target URL</label>
                    <input type="url" name="target_url" placeholder="https://example.com" required>
                </div>
                <div class="form-group">
                    <label>Check Interval (seconds)</label>
                    <input type="number" name="check_interval" value="60" min="10" required>
                </div>
                <div class="form-group">
                    <label>Expected Status Codes (comma-separated)</label>
                    <input type="text" name="expected_status_codes" value="200" required>
                </div>
                <div class="form-group">
                    <label>Failure Threshold</label>
                    <input type="number" name="failure_count" value="3" min="1">
                </div>
                <div class="form-group">
                    <label>Enabled</label>
                    <select name="enabled">
                        <option value="true" selected>Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal('createMonitorModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Monitor Modal -->
    <div class="modal-overlay" id="editMonitorModal">
        <div class="modal">
            <h2>Edit Monitor</h2>
            <form id="editMonitorForm">
                <input type="hidden" name="monitor_id" id="editMonitorId">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" id="editName" required>
                </div>
                <div class="form-group">
                    <label>Target URL</label>
                    <input type="url" name="target_url" id="editUrl" required>
                </div>
                <div class="form-group">
                    <label>Check Interval (seconds)</label>
                    <input type="number" name="check_interval" id="editInterval" min="10" required>
                </div>
                <div class="form-group">
                    <label>Expected Status Codes (comma-separated)</label>
                    <input type="text" name="expected_status_codes" id="editCodes" required>
                </div>
                <div class="form-group">
                    <label>Enabled</label>
                    <select name="enabled" id="editEnabled">
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal('editMonitorModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Resolve Incident Modal -->
    <div class="modal-overlay" id="resolveModal">
        <div class="modal">
            <h2>Resolve Incident</h2>
            <form id="resolveForm">
                <input type="hidden" id="resolveIncidentId">
                <div class="form-group">
                    <label>Notes (optional)</label>
                    <input type="text" id="resolveNotes" placeholder="Root cause or resolution details" maxlength="255">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal('resolveModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Resolve</button>
                </div>
            </form>
        </div>
    </div>

    <!-- History Modal -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal">
            <h2>Monitor History</h2>
            <div id="historyTableContainer">Loading...</div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" onclick="closeModal('historyModal')">Close</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        if (!requireAuth()) throw 'redirect';

        // Viewers can only see the public status page
        const _session = getSession();
        if (_session && _session.role === 'viewer') {
            window.location.href = 'status.html';
            throw 'redirect';
        }

        // Show Admin nav if user is admin
        if (_session && _session.role === 'admin') {
            document.getElementById('nav-admin').style.display = '';
        }

        let monitorsData = [];
        let incidentsData = [];

        async function loadMonitors() {
            try {
                const data = await API.getMonitors();
                monitorsData = data.monitors || [];
                renderMonitors();
                if (incidentsData.length > 0) renderIncidents(incidentsData);
            } catch (err) {
                document.getElementById('monitorsTable').innerHTML =
                    '<div class="empty-state"><p>Failed to load monitors</p></div>';
            }
        }

        let lastIncidentHash = '';

        async function pollIncidents() {
            try {
                const data = await API.getIncidents();
                const incidents = data.incidents || [];

                // Simple change detection
                const hash = JSON.stringify(
                    incidents.map(i => ({
                        id: i.id,
                        resolved: i.resolved,
                        resolved_time: i.resolved_time,
                        status_code: i.status_code
                    }))
                );

                if (hash !== lastIncidentHash) {
                    lastIncidentHash = hash;
                    incidentsData = incidents;
                    renderIncidents(incidents);
                }
            } catch (err) {
                console.warn('Incident polling failed:', err);
            }
        }


        function renderMonitors() {
            const el = document.getElementById('monitorsTable');
            if (!monitorsData.length) {
                el.innerHTML = '<div class="empty-state"><p>No monitors yet. Add one to get started.</p></div>';
                return;
            }
            el.innerHTML = `<div class="table-wrap"><table>
                <thead><tr>
                    <th>ID</th><th>Status</th><th>Name</th><th>URL</th><th>Interval</th><th>Expected Codes</th><th>Allowed Failures</th><th>Created</th><th>Actions</th>
                </tr></thead>
                <tbody>${monitorsData.map(m => `<tr>
                    <td>#${m.id}</td>
                    <td>
                        <div style="display: flex; align-items: center;">
                            <span class="status-dot ${m.enabled ? 'up' : 'disabled'}"></span>${m.enabled ? 'Active' : 'Disabled'}
                        </div>
                    </td>
                    <td><strong>${esc(m.name)}</strong></td>
                    <td class="text-sm text-muted">${esc(m.target_url)}</td>
                    <td>${m.check_interval}s</td>
                    <td>${m.status_codes ? m.status_codes.join(', ') : '—'}</td>
                    <td>${m.failure_count}</td>
                    <td class="text-sm text-muted" style="white-space: nowrap">${formatTime(m.created_time)}</td>
                    <td>
                        <div style="display: flex; gap: 6px; white-space: nowrap;">
                            <button class="btn btn-outline btn-sm" onclick="editMonitor(${m.id})">Edit</button>
                            <button class="btn btn-outline btn-sm" onclick="showHistory(${m.id})">History</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteMonitor(${m.id})">Delete</button>
                        </div>
                    </td>
                </tr>`).join('')}</tbody></table></div>`;
        }

        async function showHistory(id) {
            openModal('historyModal');
            document.getElementById('historyTableContainer').innerHTML = '<p>Loading history...</p>';
            try {
                const data = await API.getMonitorHistory(id);
                const history = data.history || [];
                renderHistory(history);
            } catch (err) {
                document.getElementById('historyTableContainer').innerHTML = '<p class="text-error">Failed to load history</p>';
            }
        }

        function renderHistory(history) {
            const el = document.getElementById('historyTableContainer');
            if (!history.length) {
                el.innerHTML = '<p>No history records found.</p>';
                return;
            }
            el.innerHTML = `<div class="table-wrap"><table>
                <thead><tr>
                    <th>Time</th><th>Operation</th>
                </tr></thead>
                <tbody>${history.map(h => `<tr>
                    <td>${formatTime(h.time)}</td>
                    <td>${h.operation}</td>
                </tr>`).join('')}</tbody></table></div>`;
        }

        async function loadIncidents() {
            try {
                const data = await API.getIncidents();
                incidentsData = data.incidents || [];
                renderIncidents(incidentsData);
            } catch (err) {
                document.getElementById('incidentsTable').innerHTML =
                    '<div class="empty-state"><p>Failed to load incidents</p></div>';
            }
        }

        function renderIncidents(incidents) {
            const el = document.getElementById('incidentsTable');
            if (!incidents.length) {
                el.innerHTML = '<div class="empty-state"><p>No incidents recorded.</p></div>';
                return;
            }
            el.innerHTML = `<div class="table-wrap"><table>
                <thead><tr>
                    <th>ID</th><th>Monitor ID</th><th>Monitor Name</th><th>Status</th><th>Status Code</th><th>Expected Codes</th><th>Down Since</th><th>Resolved</th><th>Actions</th>
                </tr></thead>
                <tbody>${incidents.map(i => {
                    const monitor = monitorsData.find(m => m.id === i.monitor_id);
                    const monitorName = monitor ? monitor.name : 'Unknown';
                    return `<tr>
                    <td>#${i.id}</td>
                    <td>#${i.monitor_id}</td>
                    <td><strong>${esc(monitorName)}</strong></td>
                    <td><span class="badge ${i.resolved ? 'badge-success' : 'badge-danger'}">${i.resolved ? 'Resolved' : 'Active'}</span></td>
                    <td>${i.status_code}</td>
                    <td class="text-sm text-muted">${i.expected_status_codes || '—'}</td>
                    <td class="text-sm" style="white-space: nowrap">${formatTime(i.down_time)}</td>
                    <td class="text-sm" style="white-space: nowrap">${i.resolved_time && i.resolved_time > 0 ? formatTime(i.resolved_time) : '—'}</td>
                    <td>${!i.resolved ? `<button class="btn btn-primary btn-sm" onclick="openResolve(${i.id})">Resolve</button>` : ''}</td>
                </tr>`}).join('')}</tbody></table></div>`;
        }

        function editMonitor(id) {
            const m = monitorsData.find(m => m.id === id);
            if (!m) return;
            document.getElementById('editMonitorId').value = m.id;
            document.getElementById('editName').value = m.name;
            document.getElementById('editUrl').value = m.target_url;
            document.getElementById('editInterval').value = m.check_interval;
            document.getElementById('editCodes').value = m.status_codes ? m.status_codes.join(', ') : '';
            document.getElementById('editEnabled').value = String(m.enabled);
            openModal('editMonitorModal');
        }

        async function deleteMonitor(id) {
            if (!confirm('Delete this monitor? This cannot be undone.')) return;
            try {
                await API.deleteMonitor(id);
                showToast('Monitor deleted');
                loadMonitors();
            } catch (err) { showToast('Failed: ' + err.message, 'error'); }
        }

        function openResolve(id) {
            document.getElementById('resolveIncidentId').value = id;
            document.getElementById('resolveNotes').value = '';
            openModal('resolveModal');
        }

        // Form handlers
        document.getElementById('createMonitorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            try {
                await API.createMonitor(Object.fromEntries(fd));
                closeModal('createMonitorModal');
                e.target.reset();
                showToast('Monitor created');
                loadMonitors();
            } catch (err) { showToast('Failed: ' + err.message, 'error'); }
        });

        document.getElementById('editMonitorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            try {
                await API.updateMonitor(Object.fromEntries(fd));
                closeModal('editMonitorModal');
                showToast('Monitor updated');
                loadMonitors();
            } catch (err) { showToast('Failed: ' + err.message, 'error'); }
        });

        document.getElementById('resolveForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('resolveIncidentId').value;
            const notes = document.getElementById('resolveNotes').value;
            try {
                await API.resolveIncident(id, notes);
                closeModal('resolveModal');
                showToast('Incident resolved');
                loadIncidents();
            } catch (err) { showToast('Failed: ' + err.message, 'error'); }
        });

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        loadMonitors();
        loadIncidents();
        setInterval(pollIncidents, 5000);
    </script>
</body>
</html>
