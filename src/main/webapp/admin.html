<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — WebsiteHealthMonitor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-brand"><span>&#9679;</span> UptimeMonitor</div>
        <div class="nav-links">
            <a href="dashboard.html">Monitors</a>
            <a href="admin.html" class="active">Admin</a>
            <a href="status.html">Status</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="container">
        <!-- Invite Links -->
        <div class="card">
            <div class="card-header">
                <h2>Invite Users</h2>
            </div>
            <p class="text-sm text-muted mb-16">Generate a one-time invite code to add operators or viewers to your organization. Codes expire in 30 seconds.</p>
            <div class="flex gap-8">
                <button class="btn btn-primary" onclick="generateInvite('operator')">Invite Operator</button>
                <button class="btn btn-outline" onclick="generateInvite('viewer')">Invite Viewer</button>
            </div>
            <div id="inviteResult" class="hidden mt-16">
                <div class="form-group">
                    <label>Invite Link (share this immediately — expires in 30s)</label>
                    <div class="flex gap-8">
                        <input type="text" id="inviteUrl" readonly style="font-family:monospace;">
                        <button class="btn btn-outline btn-sm" onclick="copyInvite()">Copy Link</button>
                    </div>
                </div>
                <div class="mt-8">
                    <a id="invitePreview" href="#" target="_blank" class="text-sm">Open invite page &rarr;</a>
                </div>
                <div id="inviteTimer" class="text-sm text-muted mt-8"></div>
            </div>
        </div>

        <!-- Delete User -->
        <div class="card">
            <div class="card-header">
                <h2>Remove User</h2>
            </div>
            <form id="deleteUserForm" class="flex gap-8" style="align-items:flex-end;">
                <div class="form-group" style="flex:1;margin:0;">
                    <label>User Email</label>
                    <input type="email" id="deleteEmail" placeholder="user@company.com" required>
                </div>
                <button type="submit" class="btn btn-danger">Remove</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        if (!requireAuth()) throw 'redirect';
        
        const _session = getSession();
        if (!_session || _session.role !== 'admin') {
            window.location.href = 'dashboard.html';
            throw 'redirect';
        }

        let countdownInterval = null;

        async function generateInvite(role) {
            try {
                const code = await API.generateInviteLink(role);
                const trimmed = code.trim();
                const base = window.location.origin + window.location.pathname.replace('admin.html', '');
                const inviteUrl = base + 'invite.html?code=' + encodeURIComponent(trimmed);
                document.getElementById('inviteUrl').value = inviteUrl;
                document.getElementById('invitePreview').href = inviteUrl;
                document.getElementById('inviteResult').classList.remove('hidden');
                showToast(`${role} invite link generated (30s expiry)`);
                startCountdown();
            } catch (err) { showToast('Failed: ' + err.message, 'error'); }
        }

        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            let remaining = 30;
            const timerEl = document.getElementById('inviteTimer');
            timerEl.textContent = 'Expires in ' + remaining + 's';
            timerEl.style.color = 'var(--warning)';
            countdownInterval = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    timerEl.textContent = 'Expired — generate a new link';
                    timerEl.style.color = 'var(--danger)';
                    document.getElementById('inviteUrl').style.opacity = '0.4';
                } else {
                    timerEl.textContent = 'Expires in ' + remaining + 's';
                    if (remaining <= 10) timerEl.style.color = 'var(--danger)';
                }
            }, 1000);
            document.getElementById('inviteUrl').style.opacity = '1';
        }

        function copyInvite() {
            const input = document.getElementById('inviteUrl');
            navigator.clipboard.writeText(input.value);
            showToast('Invite link copied to clipboard');
        }

        document.getElementById('deleteUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('deleteEmail').value;
            if (!confirm(`Remove user ${email}?`)) return;
            try {
                await API.deleteUser(email);
                showToast('User removed');
                document.getElementById('deleteEmail').value = '';
            } catch (err) { showToast('Failed: ' + err.message, 'error'); }
        });
    </script>
</body>
</html>
