<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join via Invite — WebsiteHealthMonitor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Join Organization</h1>
            <p id="inviteMsg">Enter the invite code from your admin and create your account.</p>
            <form id="inviteForm">
                <div class="form-group" id="codeGroup">
                    <label for="code">Invite Code</label>
                    <input type="text" id="code" placeholder="Paste invite code" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@company.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Choose a password" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="invBtn">Join</button>
            </form>
            <p class="mt-16 text-center text-sm">
                <a href="login.html">Back to sign in</a>
            </p>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        // Pre-fill code from URL if present
        const params = new URLSearchParams(window.location.search);
        if (params.get('code')) {
            document.getElementById('code').value = params.get('code');
            document.getElementById('code').readOnly = true;
            document.getElementById('inviteMsg').textContent = 'You\'ve been invited! Create your account to join.';
            document.getElementById('codeGroup').style.display = 'none';
        }

        document.getElementById('inviteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('invBtn');
            btn.disabled = true;
            try {
                await API.createUserFromLink(
                    document.getElementById('email').value,
                    document.getElementById('password').value,
                    document.getElementById('code').value
                );
                showToast('Account created! You can now sign in.');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } catch (err) {
                showToast('Failed: ' + err.message, 'error');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
